name: Check

on:
  push:
  pull_request:

jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Rebuild single-file bundle
        run: node tests/build-single.mjs
      - name: Ensure dist is committed in sync
        run: git diff --exit-code -- dist/index.html
